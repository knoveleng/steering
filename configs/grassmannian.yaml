# Configuration for Grassmannian Plane Optimization

# Model configuration
model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  device: "cuda"
  dtype: "bfloat16"

# Generation parameters
generation:
  max_length: 256
  temperature: 0.1
  top_p: 0.9
  do_sample: true

# Chat template configuration
chat_template:
  enabled: true
  system_prompt: null
  add_generation_prompt: true

# Data configuration
data:
  harmful_dataset: "data/advbench.json"
  harmless_dataset: "data/alpaca.json"
  harmful_samples: 416  # null for all
  harmless_samples: 512

# Feature direction extraction
direction:
  method: "diff_in_means"

# Steering configuration
steering:
  mode: "adaptive"  # Options: standard, adaptive
  threshold: 0.0  # For adaptive mode
  cache_rotations: true

# Plane construction method
plane_constructor: "grassmannian"  # Options: "pca" (default), "grassmannian"

# Grassmannian optimization hyperparameters
# Plane construction method
plane_constructor: "grassmannian"  # Options: "pca" (default), "grassmannian"

# Grassmannian optimization hyperparameters (FIXED)
grassmannian:
  # Objective weights
  alpha: 1.0        # Separability weight (higher = prioritize separation)
  beta: 0.5         # Focus weight (increased from 0.1 - higher = more feature alignment)
  
  # Optimization settings
  lr: 0.1           # Learning rate (increased from 0.05 for faster convergence)
  max_iterations: 100  # Reduced from 150 (converges faster with correct objective)
  convergence_threshold: 0.0001
  
  # Implementation choice
  use_geoopt: true  # Use geoopt library (recommended) vs manual implementation
  
  # Adam optimizer settings
  betas: [0.9, 0.999]  # Adam betas
  
  # Regularization
  gradient_clip: 1.0  # Gradient clipping for stability
  
  # Learning rate schedule
  use_lr_schedule: true  # Use cosine annealing
  
  # Early stopping
  early_stopping_patience: 15
  
  # CRITICAL FIX: Do not normalize activations (preserves magnitude information)
  normalize_activations: false

# Layer selection (null for auto-detection)
layers:
  extraction_layers: null
  target_layers: null

artifacts_dir: "artifacts"
analysis_dir: "analysis"
save_artifacts: true
run_analysis: true