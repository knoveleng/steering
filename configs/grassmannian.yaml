# Configuration for Grassmannian Plane Optimization

# Model configuration
model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  device: "cuda"
  dtype: "bfloat16"

# Generation parameters
generation:
  max_length: 256
  temperature: 0.1
  top_p: 0.9
  do_sample: true

# Chat template configuration
chat_template:
  enabled: true
  system_prompt: null
  add_generation_prompt: true

# Data configuration
data:
  harmful_dataset: "data/advbench.json"
  harmless_dataset: "data/alpaca.json"
  harmful_samples: 416  # null for all
  harmless_samples: 512

# Feature direction extraction
direction:
  method: "diff_in_means"

# Steering configuration
steering:
  mode: "adaptive"  # Options: standard, adaptive
  threshold: 0.0  # For adaptive mode
  cache_rotations: true

# Plane construction method
plane_constructor: "grassmannian"  # Options: "pca" (default), "grassmannian"

# Grassmannian optimization hyperparameters
grassmannian:
  # Objective weights
  alpha: 1.0        # Separability weight (higher = prioritize separation)
  beta: 0.1         # Preservation weight (higher = preserve more info)
  
  # Optimization settings
  lr: 0.05           # Learning rate for Riemannian optimization
  max_iterations: 150
  convergence_threshold: 0.0001
  
  # Implementation choice
  use_geoopt: true  # Use geoopt library (recommended) vs manual implementation

# Layer selection (null for auto-detection)
layers:
  extraction_layers: null
  target_layers: null

# Evaluation
evaluation:
  theta_range:
    start: 0
    end: 360
    step: 10
  metrics:
    - "refusal_score"

artifacts_dir: "artifacts"
analysis_dir: "analysis"
save_artifacts: true
run_analysis: true